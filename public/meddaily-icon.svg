    <rect x="640" y="652" width="72" height="40" rx="16" fill="#FFF3E0"/>
    <rect x="656" y="660" width="40" height="24" rx="10" fill="#2A1658"/>
    <g fill="#FFF3E0">
      <rect x="566" y="730" width="76" height="27" rx="8"/>
      <rect x="590" y="706" width="27" height="76" rx="8"/>
    </g>
    <circle cx="724" cy="718" r="17" fill="#FFD54A"/>
