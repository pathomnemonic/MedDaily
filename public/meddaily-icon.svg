    <path d="M 375 150 C 378 178, 380 195, 380 212"/>
  </g>
  <g fill="none" stroke="#FFF3E0" stroke-width="46" stroke-linecap="round">
    <path d="M 200 212 C 200 285, 240 318, 290 326"/>
    <path d="M 380 212 C 380 285, 340 318, 290 326"/>
  </g>
  <circle cx="290" cy="326" r="25" fill="#FFF3E0"/>

  <!-- the long tube: down, up, down in a sine wave, then into the controller -->
  <path d="M 290 326 C 300 430, 340 520, 430 548 C 520 576, 580 520, 640 540 C 690 556, 722 600, 722 668"
